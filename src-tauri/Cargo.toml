[package]
name = "georeport-desktop"
version = "1.0.0"
description = "GeoReport — Municipal GIS Portal for Loon, Province of Bohol"
authors = ["Dwennie"]
license = "MIT"
edition = "2021"

[[bin]]
name = "GeoReport"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
